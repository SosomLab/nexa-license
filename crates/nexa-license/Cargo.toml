[package]
name = "nexa-license"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Nexa family license library — key=value license/lease format, canonical signing bytes, Crockford base32, product descriptor, request code, machine ID, chain verification (verification only)"

[lints]
workspace = true

[features]
default = []
# 서명 검증 어댑터(Ed25519 · dalek 2.x) — 앱·발급기 검증용. 서명 **생성**은 여기 없다(비공개 nexa-license-server만 · docs/25 §9-1).
ed25519 = ["dep:ed25519-dalek"]
# 3-OS 기기 ID(Windows MachineGuid · macOS IOPlatformUUID · Linux machine-id) → SHA-256(도메인 ‖ 원문)[..20].
machine-id = ["dep:sha2"]
# 라이선스 파일 자리(폴더는 호출측 주입) · 원자적 설치·삭제 · 변경 서명(docs/23 §5 동시 설치).
fs = []
protocol = []

[dependencies]
ed25519-dalek = { version = "2", optional = true, default-features = false, features = ["std"] }
sha2 = { version = "0.10", optional = true, default-features = false }

[dev-dependencies]
# 시험은 서명된 문서가 있어야 한다 — 시험 전용 키쌍 생성·서명(발급 코드가 아니다 · #[cfg(test)]).
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
